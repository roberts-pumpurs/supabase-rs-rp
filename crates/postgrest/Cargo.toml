[package]
name = "rp-postgrest"
version = "3.2.2"
edition = "2024"
rust-version = "1.88"
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rp-postgrest"
description = "Owned PostgREST protocol client with checked execution and typed JSON decoding"
keywords = ["postgrest", "supabase", "database", "async"]
categories = ["database", "asynchronous", "web-programming::http-client"]

[features]
default = ["rustls"]
rustls = ["reqwest/rustls"]
test-util = []

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["query"] }
rp-postgrest-error.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
thiserror.workspace = true

[dev-dependencies]
mockito.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }

[lints]
workspace = true
