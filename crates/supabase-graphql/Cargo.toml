[package]
name = "rp-supabase-graphql"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Typed GraphQL requests and partial responses for Supabase"
documentation = "https://docs.rs/rp-supabase-graphql"
readme = "README.md"
keywords = ["supabase", "graphql", "async"]
categories = ["api-bindings", "web-programming::http-client", "asynchronous"]

[features]
default = ["rustls"]
rustls = ["rp-supabase-http/rustls"]
native-tls = ["rp-supabase-http/native-tls"]

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
url.workspace = true
thiserror.workspace = true
rp-supabase-http.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
mockito.workspace = true

[lints]
workspace = true
