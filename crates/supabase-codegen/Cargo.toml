[package]
name = "rp-supabase-codegen"
description = "Build-script-first Rust bindings for PostgreSQL and Supabase schemas"
version = "0.13.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true
rust-version = "1.85"
readme = "README.md"
documentation = "https://docs.rs/rp-supabase-codegen"
keywords = ["supabase", "postgrest", "codegen", "postgres", "build-script"]
categories = ["database", "development-tools::build-utils"]

[features]
default = []
database = ["dep:postgres", "dep:postgres-native-tls", "dep:native-tls"]
cli = ["database", "dep:clap"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
heck = "0.5"
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
prettyplease = "0.3"
sqlparser = { version = "0.63", default-features = false, features = ["std"] }
postgres = { version = "0.19.14", optional = true }
postgres-native-tls = { version = "0.5", optional = true }
native-tls = { version = "0.2", optional = true }
clap = { workspace = true, optional = true }

[[bin]]
name = "rp-supabase-codegen"
path = "src/bin/rp-supabase-codegen.rs"
required-features = ["cli"]

[[test]]
name = "snapshot_cli"
path = "tests/snapshot_cli.rs"
required-features = ["cli"]

[lints]
workspace = true
