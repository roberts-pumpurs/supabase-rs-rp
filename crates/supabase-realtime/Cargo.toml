[package]
name = "rp-supabase-realtime"
description = "Supabase Realtime client: typed postgres changes, broadcast, and presence over websockets"
version.workspace = true
rust-version = "1.88"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rp-supabase-realtime"
keywords = ["supabase", "realtime", "websocket", "postgres", "async"]
categories = ["api-bindings", "asynchronous", "web-programming::websocket", "database"]

[features]
default = ["rustls"]
rustls = ["dep:rustls", "rustls/aws_lc_rs", "dep:rustls-native-certs", "tokio-tungstenite/rustls-tls-native-roots", "rp-supabase-auth/rustls"]
native-tls = ["tokio-tungstenite/native-tls", "rp-supabase-auth/native-tls"]

[dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "net", "io-util"] }
url.workspace = true
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
rp-supabase-auth = { workspace = true, default-features = false }
tokio-tungstenite.workspace = true
async-stream.workspace = true
reqwest.workspace = true
futures.workspace = true
simd-json.workspace = true
serde.workspace = true

[dev-dependencies]
test-log.workspace = true
rstest.workspace = true
tracing-subscriber.workspace = true
pretty_assertions.workspace = true
rcgen = "0.14"
tokio-rustls.workspace = true
rustls = { workspace = true, features = ["ring"] }

[lints]
workspace = true
