[package]
name = "rp-supabase-storage"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Async client for the Supabase Storage API: buckets, objects, and signed URLs"
documentation = "https://docs.rs/rp-supabase-storage"
readme = "README.md"
keywords = ["supabase", "storage", "s3", "upload", "async"]
categories = ["api-bindings", "web-programming::http-client", "asynchronous"]

[lib]
name = "rp_supabase_storage"

[features]
default = ["rustls"]
rustls = ["rp-supabase-http/rustls"]
native-tls = ["rp-supabase-http/native-tls"]

[dependencies]
bytes.workspace = true
base64.workspace = true
rp-supabase-http.workspace = true
chrono.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
mockito.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
