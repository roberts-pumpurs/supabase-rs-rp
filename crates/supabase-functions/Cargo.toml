[package]
name = "rp-supabase-functions"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Client for invoking Supabase Edge Functions"
documentation = "https://docs.rs/rp-supabase-functions"
readme = "README.md"
keywords = ["supabase", "edge-functions", "functions", "serverless", "async"]
categories = ["api-bindings", "web-programming::http-client", "asynchronous"]

[lib]
name = "rp_supabase_functions"

[features]
default = ["rustls"]
rustls = ["rp-supabase-http/rustls"]
native-tls = ["rp-supabase-http/native-tls"]

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
thiserror.workspace = true
rp-supabase-http.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
mockito.workspace = true

[lints]
workspace = true
