[package]
name = "rp-supabase-client"
description = """
Supabase PostgREST client wrapper with auth capabilities
"""
version = "0.13.1"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true
rust-version = "1.85"
readme = "README.md"
documentation = "https://docs.rs/rp-supabase-client"
keywords = ["supabase", "postgrest", "database", "client", "async"]
categories = ["api-bindings", "database", "asynchronous"]

[features]
default = ["client"]
# Authentication, response decoding, and arbitrary-precision numeric decoding.
# Without it, only the generated-binding runtime in `schema` is compiled.
client = [
    "dep:futures",
    "dep:rp-postgrest-error",
    "dep:rp-supabase-auth",
    "dep:thiserror",
    "serde_json/arbitrary_precision",
]

[dependencies]
rp-postgrest.workspace = true
serde.workspace = true
serde_json.workspace = true
rp-supabase-client-macros.workspace = true
rp-postgrest-error = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
rp-supabase-auth = { workspace = true, optional = true }

[dev-dependencies]
mockito.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "numeric_response"
required-features = ["client"]

[lints]
workspace = true
