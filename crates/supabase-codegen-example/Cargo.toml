[package]
name = "rp-supabase-codegen-example"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.85"
publish = false

[package.metadata.cargo-machete]
# Generated timestamp fields use chrono. build.rs adds the TypedBuilder derive.
ignored = ["chrono", "typed-builder"]

[dependencies]
rp-supabase-client = { workspace = true, features = ["client"] }
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
chrono.workspace = true
typed-builder.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[build-dependencies]
rp-supabase-codegen = { path = "../supabase-codegen", features = ["database"] }

[dev-dependencies]
mockito.workspace = true
rp-supabase-codegen = { path = "../supabase-codegen", features = ["database"] }
trybuild.workspace = true
