[package]
name = "rp-postgrest-error"
description = "Typed PostgREST error responses with exact error codes and HTTP status."
# Own version: rp-postgrest re-exports this crate, so a lockstep workspace bump would be a
# breaking change for rp-postgrest users in a patch release.
version = "0.8.4"
rust-version = "1.88"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rp-postgrest-error"
keywords = ["supabase", "postgrest", "error", "postgres", "http"]
categories = ["database", "web-programming"]

[dependencies]
http.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
