[package]
name = "rp-supabase-auth"
version.workspace = true
rust-version = "1.88"
authors.workspace = true
description = "Typed async client for Supabase Auth (GoTrue) with automatic JWT refresh"
documentation = "https://docs.rs/rp-supabase-auth"
keywords = ["supabase", "auth", "gotrue", "jwt", "authentication"]
categories = ["authentication", "api-bindings", "asynchronous", "web-programming::http-client"]
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
redact.workspace = true
url.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync"] }
futures.workspace = true
serde.workspace = true
simd-json.workspace = true
thiserror.workspace = true
tracing.workspace = true
typed-builder.workspace = true
chrono.workspace = true
rp-supabase-http.workspace = true
base64.workspace = true
sha2 = "0.11"
getrandom = "0.4"

[features]
default = ["rustls"]
rustls = ["rp-supabase-http/rustls"]
native-tls = ["rp-supabase-http/native-tls"]
file-session-store = ["tokio/fs", "tokio/io-util"]

[dev-dependencies]
rstest.workspace = true
test-log.workspace = true
tracing-subscriber.workspace = true
mockito.workspace = true
# Path only: cargo drops it on publish, so releasing auth never waits for the mock crate.
rp-supabase-mock = { path = "../supabase-mock" }
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
