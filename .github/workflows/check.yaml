permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

name: check
jobs:
  fmt:
    runs-on: ubuntu-22.04
    name: fmt
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup repo
        uses: ./.github/actions/setup-repo

      - name: cargo xtask check
        run: cargo xtask check

      # release-plz publishes in normal-dependency order and ignores dev-dependencies.
      # A versioned dev-dependency on a workspace crate that is bumped in the same release
      # makes crates.io reject the publish. Path-only dev-dependencies are stripped on publish.
      - name: Workspace dev-dependencies are path-only
        run: |
          bad=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] as $p | $p.dependencies[] | select(.kind == "dev" and .path != null and .req != "*") | "\($p.name) -> \(.name) \(.req)"')
          if [ -n "$bad" ]; then
            echo "Remove the version from these workspace dev-dependencies:"
            echo "$bad"
            exit 1
          fi

  msrv:
    runs-on: ubuntu-22.04
    name: Rust 1.88
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-repo
        with:
          toolchain: "1.88.0"
      - run: cargo check --workspace --all-features --all-targets --locked

  tls:
    runs-on: ubuntu-22.04
    name: TLS (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rustls
            facade: full,rustls
            realtime: rustls
          - name: native-tls
            facade: full,native-tls
            realtime: native-tls
          - name: plain
            facade: full
            realtime: ""
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-repo
      - run: cargo check -p supabase-rp --no-default-features --features "${{ matrix.facade }}" --locked
      - run: cargo test -p rp-supabase-realtime --no-default-features --features "${{ matrix.realtime }}" --test reconnect --locked
