[workspace]
resolver = "2"
members = ["crates/*", "xtask", "examples"]

[workspace.package]
version = "0.12.0"
authors = [
  "Roberts Pumpurs <roberts@pumpurlabs.com>",
]
description = """
Utilities for interacting with Supabase from Rust
"""
keywords = ["supabase", "postgrest", "auth", "realtime", "jwt"]
categories = ["database", "authentication", "asynchronous"]
repository = "https://github.com/roberts-pumpurs/supabase-rs-rp"
homepage = "https://github.com/roberts-pumpurs/supabase-rs-rp"
license = "MIT OR Apache-2.0"
edition = "2024"
exclude = [
  "/.github/",
  "/xtask/",
  "/supabase/",
]

[workspace.lints.clippy]
cargo = { priority = -1, level = "deny" }
complexity = { priority = -1, level = "deny" }
correctness = { priority = -1, level = "deny" }
nursery = { priority = -1, level = "deny" }
pedantic = { priority = -1, level = "deny" }
perf = { priority = -1, level = "deny" }
restriction = { priority = -1, level = "deny" }
style = { priority = -1, level = "deny" }
suspicious = { priority = -1, level = "deny" }

renamed_function_params = "allow"
arbitrary_source_item_ordering = "allow"
shadow_unrelated = "allow"
iter_over_hash_type = "allow"
module_name_repetitions = "allow"
significant_drop_tightening = "allow"
cargo_common_metadata = "allow"
pattern_type_mismatch = "allow"
missing_docs_in_private_items = "allow"
blanket_clippy_restriction_lints = "allow"
implicit_return = "allow"
dbg_macro = "allow"
single_call_fn = "allow"
missing_inline_in_public_items = "allow"
question_mark_used = "allow"
absolute_paths = "allow"
missing_trait_methods = "allow"
wildcard_imports = "allow"
shadow_reuse = "allow"
exhaustive_enums = "allow"
ref_patterns = "allow"
pub_use = "allow"
single_char_lifetime_names = "allow"
multiple_crate_versions = "allow"
exhaustive_structs = "allow"
future_not_send = "allow"
separated_literal_suffix = "allow"
mod_module_files = "allow"
# Keep the repository's existing inline generic bounds; this is a style preference.
inline_trait_bounds = "allow"
# Match only relevant fields, without listing ignored fields in every pattern.
rest_pattern_accessible_field = "allow"
# Keep definitions in existing module roots and retain established test names.
definition_in_module_root = "allow"
redundant_test_prefix = "allow"
# Keep small helper, prelude, and protocol modules inline.
inline_modules = "allow"
# Existing API docs include short labels as well as complete sentences.
doc_paragraphs_missing_punctuation = "allow"
# Keep existing empty-result assertions instead of rewriting test style.
assert_is_empty = "allow"
# Keep semicolons inside unit-valued blocks; the opposite style lint conflicts.
semicolon_outside_block = "allow"

[workspace.dependencies]
# our cretes
# rp-supabase-mock has no entry here: workspace crates use it only as a path-only
# dev-dependency, so publishing never waits for the mock release.
rp-supabase-auth = { path = "crates/supabase-auth", version = "0.12", default-features = false }
rp-supabase-client = { path = "crates/supabase-client", version = "0.15", default-features = false }
rp-supabase-storage = { path = "crates/supabase-storage", version = "0.3", default-features = false }
rp-supabase-functions = { path = "crates/supabase-functions", version = "0.1", default-features = false }
supabase-rp = { path = "crates/supabase-rp", version = "0.7" }
rp-postgrest-error = { path = "crates/postgrest-error", version = "0.8" }
rp-supabase-realtime = { path = "crates/supabase-realtime", version = "0.12", default-features = false }
rp-supabase-codegen = { path = "crates/supabase-codegen", version = "0.15" }
rp-postgrest = { path = "crates/postgrest", version = "3.3", default-features = false }
rp-supabase-client-macros = { path = "crates/supabase-client-macros", version = "=0.15.0" }
rp-supabase-http = { path = "crates/supabase-http", version = "0.1", default-features = false }
rp-supabase-graphql = { path = "crates/supabase-graphql", version = "0.1", default-features = false }

# Async
futures-util = "0.3"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "deflate", "stream", "http2"] }
tokio = { version = "1", default-features = false, features = [] }
futures-timer = "3"
tokio-stream = "0.1"
async-stream = "0.3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }

# Errors
eyre = "0.6"
color-eyre = "0.6"

chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
redact = "0.1"
simd-json = "0.18"
url = "2"
rand = { version = "0.10", features = ["small_rng"] }
thiserror = "2"
xshell = "0.2"
typed-builder = "0.23"
# Mock JWTs use only HS256. Do not compile unused PEM parsing and its time dependency.
# jsonwebtoken needs one crypto backend; rustls already links aws-lc-rs.
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
rust_decimal_macros = "1"
rust_decimal = { version = "1", features = ["maths"] }
arrayvec = "0.7"
itertools = "0.15"
base64 = "0.23"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
rustls = { version = "0.23.46", default-features = false }
rustls-native-certs = "0.8"
bytes = "1.12.1"
clap = { version = "4.6", features = ["derive"] }

# Tests
rstest = "0.28"
test-log = { version = "0.2", features = ["trace"], default-features = false }
pretty_assertions = "1"
assert_matches = "1"
mockito = "1"
trybuild = "1"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "tracing-log", "json", "valuable", "tracing"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 0
